<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>くらし家計帳</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
    input[type=number]{-moz-appearance:textfield;appearance:textfield}
    body{background:#f8fafc}.safe-bottom{padding-bottom:max(1rem,env(safe-area-inset-bottom))}
  </style>
</head>
<body class="text-slate-800">
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDKqUfjDofZhvhq-yq3zA0yOUQ5yLfOowc",
      authDomain: "kurashi-kakeityou.firebaseapp.com",
      projectId: "kurashi-kakeityou",
      storageBucket: "kurashi-kakeityou.firebasestorage.app",
      messagingSenderId: "678670753801",
      appId: "1:678670753801:web:0d892729720f0a059bd8d8",
      measurementId: "G-JD8SC8YS5Z"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // React側から触れるようにWindowオブジェクトにエクスポート
    window.firebaseDb = db;
    window.firebaseDoc = doc;
    window.firebaseGetDoc = getDoc;
    window.firebaseSetDoc = setDoc;
  </script>

  <script type="text/babel">
    const {useEffect,useMemo,useRef,useState}=React;
    const n=v=>Number(String(v??"").replace(/[^0-9.-]/g,""))||0;
    const p=v=>Math.max(0,n(v));
    const yen=v=>new Intl.NumberFormat("ja-JP",{style:"currency",currency:"JPY",maximumFractionDigits:0}).format(p(v));
    const signedYen=v=>`${n(v)<0?"-":""}${yen(Math.abs(n(v)))}`;
    const nowYM=()=>new Date().toISOString().slice(0,7);
    const prevYM=ym=>{const[y,m]=ym.split("-").map(Number),d=new Date(y,m-2,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`};
    const nextYM=ym=>{const[y,m]=ym.split("-").map(Number),d=new Date(y,m,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`};
    
    const blank=()=>({
      expenses:{},
      billAmounts:{},
      balances:{},
      incomeItems:[],
      tempExpenses:[],
      securities:[],
      recoveredAmount:0,
      settlementStatus:"unpaid" // 'unpaid' | 'paid'
    });

    const initial={
      settings:{settlementStart:10,cashStart:15,lastBackupDate:null},
      categories:[
        {id:1,name:"食費",budget:50000,recovery:"half",recoveryAmount:0},
        {id:2,name:"日用品",budget:15000,recovery:"half",recoveryAmount:0},
        {id:3,name:"光熱費",budget:20000,recovery:"half",recoveryAmount:0},
        {id:4,name:"家賃",budget:85000,recovery:"full",recoveryAmount:85000}
      ],
      bills:[
        {id:1,name:"家賃",budget:85000,day:26,account:"生活口座"},
        {id:2,name:"電気・ガス",budget:16000,day:10,account:"生活口座"},
        {id:3,name:"スマホ",budget:9000,day:27,account:"メイン口座"},
        {id:4,name:"クレジットカード",budget:45000,day:4,account:"メイン口座"}
      ],
      accounts:[{id:1,name:"生活口座",balance:150000},{id:2,name:"メイン口座",balance:70000}],
      points:[
        {id:1,name:"楽天ポイント",regularRate:0.5,campaignRate:0.75},
        {id:2,name:"Vポイント",regularRate:0.5,campaignRate:0.5},
        {id:3,name:"JALマイルポイント",regularRate:1,campaignRate:1}
      ],
      pointBalances:{},
      monthly:{}
    };

    function normalize(raw){
      const d=raw||{},monthly={};
      Object.entries(d.monthly||{}).forEach(([ym,m])=>{
        monthly[ym]={
          ...blank(),
          ...(m||{}),
          incomeItems:Array.isArray(m?.incomeItems)?m.incomeItems:p(m?.income)>0?[{id:`income-${ym}`,name:"収入",amount:p(m.income)}]:[],
          tempExpenses:Array.isArray(m?.tempExpenses)?m.tempExpenses:[],
          securities:Array.isArray(m?.securities)?m.securities:[]
        };
      });

      return {
        ...initial,...d,
        settings:{...initial.settings,...(d.settings||{})},
        categories:(d.categories||initial.categories).map(x=>({recovery:"half",recoveryAmount:0,...x})),
        bills:d.bills||initial.bills,
        accounts:d.accounts||initial.accounts,
        points:(d.points||initial.points).map(x=>({
          ...x,
          regularRate:x.regularRate!==undefined?n(x.regularRate):1,
          campaignRate:x.campaignRate!==undefined?n(x.campaignRate):1
        })),
        pointBalances:d.pointBalances||{},
        monthly
      };
    }

    // --- コンポーネント群 ---
    const Card=({children,className=""})=><section className={`rounded-2xl border border-slate-200 bg-white p-4 shadow-sm ${className}`}>{children}</section>;
    const Stat=({label,value,tone=""})=><div className={`rounded-2xl p-4 shadow-sm ${tone||"border border-slate-200 bg-white"}`}><p className="text-sm opacity-70">{label}</p><p className="mt-1 text-xl font-bold">{value}</p></div>;
    const Money=({value,onChange,small=false})=><input type="number" min="0" inputMode="numeric" value={value??""} placeholder="0" onFocus={e=>e.target.select()} onChange={e=>onChange(e.target.value)} className={`${small?"w-28":"w-36"} rounded-lg border border-slate-300 bg-white px-3 py-2 text-right font-semibold outline-none focus:border-indigo-500`}/>;
    const SignedMoney=({value,onChange,small=false})=><input type="number" inputMode="decimal" value={value??""} placeholder="0" onFocus={e=>e.target.select()} onChange={e=>onChange(e.target.value)} className={`${small?"w-28":"w-36"} rounded-lg border border-slate-300 bg-white px-3 py-2 text-right font-semibold outline-none focus:border-indigo-500`}/>;
    const Decimal=({value,onChange})=><input type="number" step="0.1" min="0" inputMode="decimal" value={value??""} onFocus={e=>e.target.select()} onChange={e=>onChange(e.target.value)} className="w-24 rounded border border-slate-300 px-2 py-1.5 text-right outline-none focus:border-indigo-500"/>;
    const Text=({value,onChange,placeholder=""})=><input type="text" value={value??""} placeholder={placeholder} onFocus={e=>e.target.select()} onChange={e=>onChange(e.target.value)} className="w-full rounded border border-slate-300 px-2 py-1.5 outline-none focus:border-indigo-500"/>;

    const incomeFor=m=>(m.incomeItems||[]).reduce((s,x)=>s+p(x.amount),0);
    const recoveryFor=(c,ex)=>c.recovery==="full"?p(ex[c.id]):c.recovery==="fixed"?p(c.recoveryAmount):p(ex[c.id])/2;
    const billsFor=(data,m)=>data.bills.map(b=>({...b,amount:Object.prototype.hasOwnProperty.call(m.billAmounts||{},b.id)?p(m.billAmounts[b.id]):0}));
    const tempExpensesFor=m=>(m.tempExpenses||[]).reduce((s,x)=>s+p(x.amount),0);
    
    const assetsFor=(data,m)=>{
      const cash=data.accounts.reduce((s,a)=>s+(Object.prototype.hasOwnProperty.call(m.balances||{},a.id)?p(m.balances[a.id]):0),0);
      const securities=(m.securities||[]).reduce((s,x)=>s+p(x.value),0);
      const profit=(m.securities||[]).reduce((s,x)=>s+n(x.profit),0);
      return {cash,securities,profit,total:cash+securities};
    };

    const stats=(data,key)=>{
      const m={...blank(),...(data.monthly[key]||{})},ex=m.expenses||{},bills=billsFor(data,m);
      const life=data.categories.reduce((s,c)=>s+p(ex[c.id]),0);
      const fixed=bills.reduce((s,b)=>s+b.amount,0);
      const temp=tempExpensesFor(m);
      const spending=fixed+temp; // 精算(life)は除外し、資金管理側(固定費+臨時)のみ集計
      const income=incomeFor(m);
      const due=data.categories.reduce((s,c)=>s+recoveryFor(c,ex),0);
      const isPaid=m.settlementStatus ? m.settlementStatus==="paid" : (due>0 && p(m.recoveredAmount)>=due);
      return {
        key,m,ex,bills,life,fixed,temp,spending,totalSpending:spending,
        income,net:income-spending,due,recovered:p(m.recoveredAmount),
        isPaid,assets:assetsFor(data,m)
      };
    };

    function MonthPick({ym,setYm}){
      return <div className="inline-flex items-center gap-1">
        <button type="button" onClick={()=>setYm(prevYM(ym))} className="rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-sm font-bold text-slate-600 hover:bg-slate-50 active:bg-slate-100" title="前月へ">‹</button>
        <label className="text-sm font-medium">
          <input type="month" value={ym} onChange={e=>setYm(e.target.value)} className="rounded-lg border border-slate-300 px-3 py-2 text-sm font-semibold"/>
        </label>
        <button type="button" onClick={()=>setYm(nextYM(ym))} className="rounded-lg border border-slate-300 bg-white px-2.5 py-2 text-sm font-bold text-slate-600 hover:bg-slate-50 active:bg-slate-100" title="翌月へ">›</button>
      </div>;
    }

    // --- 1. 精算画面 ---
    function Settlement({data,m,put,ym,setYm}){
      const ex=m.expenses||{},life=data.categories.reduce((s,c)=>s+p(ex[c.id]),0),budget=data.categories.reduce((s,c)=>s+p(c.budget),0),due=data.categories.reduce((s,c)=>s+recoveryFor(c,ex),0);
      const isPaid = m.settlementStatus ? m.settlementStatus === "paid" : (due > 0 && p(m.recoveredAmount) >= due);

      const resetSettlement=()=>{
        if(confirm(`${ym} の精算データをリセットしますか？`)){
          put("expenses",{});
          put("recoveredAmount",0);
          put("settlementStatus","unpaid");
        }
      };

      const toggleStatus=()=>{
        const nextStatus = isPaid ? "unpaid" : "paid";
        put("settlementStatus", nextStatus);
        if(nextStatus === "paid" && p(m.recoveredAmount) < due){
          put("recoveredAmount", due);
        }
      };

      return <div className="space-y-4">
        <div className="flex flex-wrap items-end justify-between gap-3">
          <div><h2 className="text-xl font-bold">生活費の精算</h2><p className="mt-1 text-sm text-slate-500">{ym} の精算管理</p></div>
          <div className="flex items-center gap-2">
            <button onClick={resetSettlement} className="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm font-bold text-rose-600 hover:bg-rose-100">当月データをリセット</button>
            <MonthPick ym={ym} setYm={setYm}/>
          </div>
        </div>
        <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
          <Stat label="生活費合計" value={yen(life)}/>
          <Stat label="予算合計" value={yen(budget)} tone="bg-slate-100"/>
          <Stat label="回収対象額" value={yen(due)} tone="bg-indigo-600 text-white"/>
          <Stat label="回収済み額" value={yen(m.recoveredAmount)} tone="bg-emerald-600 text-white"/>
        </div>

        <Card>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h3 className="font-bold">パートナーからの回収ステータス</h3>
              <p className="mt-1 text-sm text-slate-500">当月の回収状態を管理します（月ごとに保持されます）。</p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={toggleStatus} className={`rounded-xl px-4 py-2 text-sm font-bold transition-all ${isPaid?"bg-emerald-600 text-white shadow-md":"bg-slate-100 text-slate-600 hover:bg-slate-200"}`}>
                {isPaid ? "✓ 回収完了" : "未回収（クリックで完了）"}
              </button>
              <button onClick={()=>{put("recoveredAmount",due);put("settlementStatus","paid");}} className="rounded-lg border border-indigo-200 bg-indigo-50 px-3 py-2 text-sm font-bold text-indigo-700">全額回収をセット</button>
            </div>
          </div>
          <div className="mt-3 flex items-center justify-end gap-2 text-sm">
            <span>実回収額:</span>
            <Money value={m.recoveredAmount} onChange={v=>put("recoveredAmount",p(v))}/>
          </div>
        </Card>

        <Card>
          <h3 className="mb-3 font-bold">カテゴリ別支出</h3>
          <div className="divide-y divide-slate-100">
            {data.categories.map(c=>{
              const value=p(ex[c.id]),rate=c.budget?Math.min(value/c.budget*100,100):0;
              const diff=c.budget-value;
              return <div key={c.id} className="grid grid-cols-[1fr_auto] items-center gap-3 py-3">
                <div>
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <span className="font-medium">{c.name}</span>
                    <div className="flex items-center gap-2 text-sm">
                      <span className="text-slate-500">予算 {yen(c.budget)}</span>
                      {c.budget>0&&(
                        <span className={`rounded px-1.5 py-0.5 text-xs font-bold ${diff<0?"bg-rose-100 text-rose-700":"bg-emerald-50 text-emerald-700"}`}>
                          {diff<0?`+${yen(Math.abs(diff))} 超過`:`残り ${yen(diff)}`}
                        </span>
                      )}
                    </div>
                  </div>
                  <div className="mt-2 h-2 overflow-hidden rounded-full bg-slate-100"><div className={`${value>c.budget?"bg-rose-500":"bg-indigo-500"} h-full`} style={{width:`${rate}%`}}/></div>
                  <p className="mt-1 text-xs text-slate-500">回収対象 {yen(recoveryFor(c,ex))} ・予算の{(c.budget?value/c.budget*100:0).toFixed(0)}%</p>
                </div>
                <Money value={value} onChange={v=>put("expenses",{...ex,[c.id]:p(v)})}/>
              </div>
            })}
          </div>
        </Card>
      </div>
    }

    // --- 前月コピー選択モーダル ---
    function CopyModal({isOpen,onClose,onCopy}){
      const [options,setOptions]=useState({incomes:true,bills:true,securities:true});
      if(!isOpen)return null;
      return <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4">
        <div className="w-full max-w-sm rounded-2xl bg-white p-6 shadow-xl space-y-4">
          <h3 className="text-lg font-bold">前月データをコピー</h3>
          <p className="text-sm text-slate-500">コピーしたい項目を選択してください。現在の入力値は上書きされます。</p>
          <div className="space-y-2">
            <label className="flex items-center gap-2 text-sm font-medium"><input type="checkbox" checked={options.incomes} onChange={e=>setOptions({...options,incomes:e.target.checked})} className="h-4 w-4 rounded border-slate-300 text-indigo-600"/> 収入項目</label>
            <label className="flex items-center gap-2 text-sm font-medium"><input type="checkbox" checked={options.bills} onChange={e=>setOptions({...options,bills:e.target.checked})} className="h-4 w-4 rounded border-slate-300 text-indigo-600"/> 固定費・支払額</label>
            <label className="flex items-center gap-2 text-sm font-medium"><input type="checkbox" checked={options.securities} onChange={e=>setOptions({...options,securities:e.target.checked})} className="h-4 w-4 rounded border-slate-300 text-indigo-600"/> 証券評価額・評価損益</label>
          </div>
          <div className="flex justify-end gap-2 pt-2">
            <button onClick={onClose} className="rounded-lg px-4 py-2 text-sm font-bold text-slate-500 hover:bg-slate-100">キャンセル</button>
            <button onClick={()=>{onCopy(options);onClose();}} className="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-bold text-white shadow hover:bg-indigo-700">コピー実行</button>
          </div>
        </div>
      </div>
    }

    // --- 2. 資金管理画面 ---
    function Cashflow({data,m,put,putMany,ym,setYm}){
      const incomeItems=m.incomeItems||[],securities=m.securities||[],tempExpenses=m.tempExpenses||[],amounts=m.billAmounts||{},balances=m.balances||{},bills=billsFor(data,m);
      const income=incomeFor(m),fixedSpending=bills.reduce((s,b)=>s+b.amount,0),tempSpending=tempExpensesFor(m),spending=fixedSpending+tempSpending,net=income-spending,assets=assetsFor(data,m);
      const [modalOpen,setModalOpen]=useState(false);

      const setIncome=x=>put("incomeItems",x);
      const setSecurities=x=>put("securities",x);
      const setTempExpenses=x=>put("tempExpenses",x);

      const resetCashflow=()=>{
        if(confirm(`${ym} の資金管理データをリセットしますか？`)){
          putMany({
            incomeItems:[],
            billAmounts:{},
            tempExpenses:[],
            securities:[],
            balances:{}
          });
        }
      };

      const copyPrevious=opts=>{
        const previous=data.monthly[prevYM(ym)];
        if(!previous)return alert("前月の保存データがありません。");
        const updates={};
        if(opts.bills) updates.billAmounts={...(previous.billAmounts||{})};
        if(opts.incomes) updates.incomeItems=(previous.incomeItems||[]).map(x=>({...x,id:`income-${Date.now()}-${Math.random()}`}));
        if(opts.securities) updates.securities=(previous.securities||[]).map(x=>({...x,id:`security-${Date.now()}-${Math.random()}`}));
        putMany(updates);
      };

      const removeItem=(type,id,list,setter)=>{
        if(confirm("この項目を削除しますか？")){
          setter(list.filter(x=>x.id!==id));
        }
      };

      const prevMonthData=data.monthly[prevYM(ym)];
      const hasPrevBalances=prevMonthData?.balances && Object.keys(prevMonthData.balances).length>0;

      return <div className="space-y-4">
        <CopyModal isOpen={modalOpen} onClose={()=>setModalOpen(false)} onCopy={copyPrevious}/>
        
        <div className="flex flex-wrap items-end justify-between gap-3">
          <div><h2 className="text-xl font-bold">個人資金管理</h2><p className="mt-1 text-sm text-slate-500">{ym} の収支・資産管理</p></div>
          <div className="flex items-center gap-2">
            <button onClick={resetCashflow} className="rounded-lg border border-rose-200 bg-rose-50 px-3 py-2 text-sm font-bold text-rose-600 hover:bg-rose-100">当月データをリセット</button>
            <MonthPick ym={ym} setYm={setYm}/>
          </div>
        </div>

        <Card>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div><h3 className="font-bold">収入項目</h3><p className="mt-1 text-sm text-slate-500">給与・副収入などを自由に追加できます。</p></div>
            <button onClick={()=>setModalOpen(true)} className="rounded-lg border border-indigo-200 bg-indigo-50 px-3 py-2 text-sm font-bold text-indigo-700">前月の入力値をコピー</button>
          </div>
          <div className="mt-4 space-y-2">
            {incomeItems.map(x=><div key={x.id} className="flex flex-wrap items-center gap-2"><Text value={x.name} placeholder="項目名" onChange={v=>setIncome(incomeItems.map(i=>i.id===x.id?{...i,name:v}:i))}/><Money value={x.amount} onChange={v=>setIncome(incomeItems.map(i=>i.id===x.id?{...i,amount:p(v)}:i))}/><button onClick={()=>removeItem("income",x.id,incomeItems,setIncome)} className="rounded-lg px-3 py-2 text-sm font-bold text-rose-600 hover:bg-rose-50">削除</button></div>)}
          </div>
          <div className="mt-3 flex flex-wrap items-center justify-between gap-3">
            <button onClick={()=>setIncome([...incomeItems,{id:`income-${Date.now()}`,name:"給与",amount:0}])} className="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-bold text-white">＋ 収入項目を追加</button>
            <strong className="text-lg text-emerald-700">総収入 {yen(income)}</strong>
          </div>
        </Card>

        <div className="grid gap-3 sm:grid-cols-3">
          <Stat label="総収入" value={yen(income)} tone="bg-emerald-600 text-white"/>
          <Stat label="支出合計（固定費+臨時）" value={yen(spending)}/>
          <Stat label="月間純貯蓄（収入 − 支出）" value={signedYen(net)} tone={net<0?"bg-rose-600 text-white":"bg-indigo-600 text-white"}/>
        </div>

        {/* 固定費テーブル */}
        <Card className="overflow-hidden p-0">
          <div className="p-4"><h3 className="font-bold">固定費・定期引き落とし</h3></div>
          <div className="hidden sm:block overflow-x-auto">
            <table className="w-full min-w-[620px] text-sm"><thead className="bg-slate-50 text-left text-slate-500"><tr><th className="px-4 py-3">名称</th><th>支払日</th><th>引落口座</th><th className="px-4 text-right">今月支払額</th></tr></thead>
            <tbody className="divide-y divide-slate-100">{bills.map(b=><tr key={b.id}><td className="px-4 py-3 font-medium">{b.name}</td><td>{b.day}日</td><td>{b.account}</td><td className="px-4 py-2 text-right"><Money small value={b.amount} onChange={v=>put("billAmounts",{...amounts,[b.id]:p(v)})}/></td></tr>)}</tbody></table>
          </div>
          <div className="sm:hidden divide-y divide-slate-100">
            {bills.map(b=><div key={b.id} className="p-3 flex items-center justify-between"><div><p className="font-bold">{b.name}</p><p className="text-xs text-slate-500">{b.day}日・{b.account}</p></div><Money small value={b.amount} onChange={v=>put("billAmounts",{...amounts,[b.id]:p(v)})}/></div>)}
          </div>
        </Card>

        {/* 臨時出費 */}
        <Card>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div><h3 className="font-bold text-rose-700">当月の臨時出費</h3><p className="mt-1 text-sm text-slate-500">冠婚葬祭・旅行など今月限りの特別な出費を入力します。</p></div>
            <button onClick={()=>setTempExpenses([...tempExpenses,{id:`temp-${Date.now()}`,name:"臨時出費",amount:0}])} className="rounded-lg bg-rose-600 px-3 py-2 text-sm font-bold text-white">＋ 臨時出費を追加</button>
          </div>
          <div className="mt-4 space-y-2">
            {tempExpenses.map(x=><div key={x.id} className="flex flex-wrap items-center gap-2"><Text value={x.name} placeholder="臨時出費名" onChange={v=>setTempExpenses(tempExpenses.map(t=>t.id===x.id?{...t,name:v}:t))}/><Money value={x.amount} onChange={v=>setTempExpenses(tempExpenses.map(t=>t.id===x.id?{...t,amount:p(v)}:t))}/><button onClick={()=>removeItem("temp",x.id,tempExpenses,setTempExpenses)} className="rounded-lg px-3 py-2 text-sm font-bold text-rose-600 hover:bg-rose-50">削除</button></div>)}
          </div>
          {tempExpenses.length>0&&<div className="mt-3 text-right text-sm font-bold text-rose-700">臨時出費合計: {yen(tempSpending)}</div>}
        </Card>

        {/* 証券口座 */}
        <Card>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div><h3 className="font-bold">証券口座・投資資産</h3><p className="mt-1 text-sm text-slate-500">月ごとの評価額と含み損益を記録します。</p></div>
            <button onClick={()=>setSecurities([...securities,{id:`security-${Date.now()}`,name:"証券口座",value:0,profit:0}])} className="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-bold text-white">＋ 証券口座を追加</button>
          </div>
          <div className="mt-4 overflow-x-auto">
            <table className="w-full min-w-[600px] text-sm"><thead className="bg-slate-50 text-left text-slate-500"><tr><th className="px-3 py-2">銘柄 / 口座名</th><th>評価額</th><th>含み損益</th><th/></tr></thead>
            <tbody className="divide-y divide-slate-100">{securities.map(s=><tr key={s.id}><td className="py-2 pr-2"><Text value={s.name} onChange={v=>setSecurities(securities.map(x=>x.id===s.id?{...x,name:v}:x))}/></td><td className="py-2 pr-2"><Money small value={s.value} onChange={v=>setSecurities(securities.map(x=>x.id===s.id?{...x,value:p(v)}:x))}/></td><td className="py-2 pr-2"><SignedMoney small value={s.profit} onChange={v=>setSecurities(securities.map(x=>x.id===s.id?{...x,profit:n(v)}:x))}/></td><td className="py-2 text-right"><button onClick={()=>removeItem("security",s.id,securities,setSecurities)} className="text-sm font-bold text-rose-600">削除</button></td></tr>)}</tbody></table>
          </div>
          <div className="mt-3 flex gap-4 text-sm"><strong>証券評価額合計 {yen(assets.securities)}</strong><strong className={assets.profit<0?"text-rose-600":"text-emerald-600"}>含み損益合計 {signedYen(assets.profit)}</strong></div>
        </Card>

        {/* 口座残高 */}
        <Card>
          <div className="flex flex-wrap items-center justify-between gap-3">
            <div>
              <h3 className="font-bold">口座別の不足チェック</h3>
              <p className="mt-1 text-sm text-slate-500">引き落とし予定額に対する時点残高の過不足を確認します。</p>
            </div>
            {hasPrevBalances && (
              <button
                type="button"
                onClick={()=>{
                  put("balances", {...prevMonthData.balances});
                }}
                className="rounded-lg border border-indigo-200 bg-indigo-50 px-3 py-1.5 text-xs font-bold text-indigo-700 hover:bg-indigo-100"
              >
                前月の口座残高を反映
              </button>
            )}
          </div>
          <div className="mt-3 grid gap-3 lg:grid-cols-2">{data.accounts.map(a=>{
            const debit=bills.filter(b=>b.account===a.name).reduce((s,b)=>s+b.amount,0),balance=Object.prototype.hasOwnProperty.call(balances,a.id)?p(balances[a.id]):0,remaining=balance-debit;
            const prevBalance=prevMonthData?.balances?.[a.id];
            return <div key={a.id} className={`rounded-xl border p-3 ${remaining<0?"border-rose-200 bg-rose-50":"border-slate-200"}`}>
              <div className="flex justify-between gap-2">
                <strong>{a.name}</strong>
                <strong className={remaining<0?"text-rose-600":"text-emerald-600"}>{remaining<0?`不足 ${yen(-remaining)}`:`想定残高 ${yen(remaining)}`}</strong>
              </div>
              <div className="mt-3 flex items-center justify-between gap-3 text-sm">
                <div className="flex flex-col">
                  <span>時点残高</span>
                  {prevBalance!==undefined && !Object.prototype.hasOwnProperty.call(balances,a.id) && (
                    <span className="text-[11px] text-slate-400">前月: {yen(prevBalance)}</span>
                  )}
                </div>
                <Money small value={balance} onChange={v=>put("balances",{...balances,[a.id]:p(v)})}/>
              </div>
            </div>;
          })}</div>
        </Card>
      </div>
    }

    // --- グラフコンポーネント (SVG) ---
    function Donut({rows, title="生活費割合"}){
      const total=rows.reduce((s,x)=>s+x.amount,0),colors=["#4f46e5","#06b6d4","#10b981","#f59e0b","#f43f5e","#8b5cf6"];
      let offset=0;
      if(total<=0)return <div className="flex h-52 items-center justify-center text-sm text-slate-500">データを入力するとグラフが表示されます。</div>;

      const segments=rows.filter(x=>x.amount>0).map((x,index)=>{
        const percent=x.amount/total*100;
        const node=<circle key={x.id||index} cx="21" cy="21" r="15.9155" fill="transparent" stroke={colors[index%colors.length]} strokeWidth="7" strokeDasharray={`${percent} ${100-percent}`} strokeDashoffset={-offset}/>;
        offset+=percent;
        return node;
      });

      return <div className="flex flex-col items-center gap-4 sm:flex-row">
        <svg viewBox="0 0 42 42" className="h-44 w-44 -rotate-90">
          <circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="#e2e8f0" strokeWidth="7"/>
          {segments}
          <circle cx="21" cy="21" r="10" fill="white"/>
          <text x="21" y="20" textAnchor="middle" className="fill-slate-600 text-[3px] rotate-90 origin-center">{title}</text>
          <text x="21" y="24" textAnchor="middle" className="fill-slate-900 text-[3px] font-bold rotate-90 origin-center">{yen(total)}</text>
        </svg>
        <div className="w-full space-y-2">
          {rows.map((x,index)=><div key={x.id||index} className="flex items-center justify-between gap-3 text-sm"><span className="flex items-center gap-2"><i className="h-3 w-3 rounded-full" style={{background:colors[index%colors.length]}}/>{x.name}</span><strong>{(x.amount/total*100).toFixed(1)}% ({yen(x.amount)})</strong></div>)}
        </div>
      </div>
    }

    function Chart({data,color="bg-indigo-500",signed=false}){
      const values=data.map(x=>x.value);
      const hasNegative=signed && values.some(v=>v<0);
      const maxVal=Math.max(...values,1);
      const minVal=hasNegative?Math.min(...values,0):0;
      const range=hasNegative?(maxVal-minVal)||1:maxVal;

      if(!hasNegative){
        return <div className="mt-4 flex h-44 items-end gap-2 border-b border-slate-200 px-1 overflow-x-auto">
          {data.map(x=>(
            <div key={x.label} className="flex min-w-8 flex-1 flex-col items-center justify-end gap-1">
              <span className="text-[10px] text-slate-500">{signed?signedYen(x.value):yen(x.value)}</span>
              <div title={`${x.label}: ${signed?signedYen(x.value):yen(x.value)}`} className={`w-full max-w-10 rounded-t ${color}`} style={{height:`${Math.max(x.value/maxVal*130,2)}px`}}/>
              <span className="whitespace-nowrap text-[10px] text-slate-500">{x.label.length > 5 ? x.label.slice(5).replace("-","/") : x.label}</span>
            </div>
          ))}
        </div>;
      }

      // 負数を含む場合のゼロライン付きレイアウト
      const zeroPos=(maxVal/range)*110;
      return <div className="mt-4 flex h-48 items-center gap-2 px-1 overflow-x-auto">
        {data.map(x=>{
          const isNeg=x.value<0;
          const barH=Math.max(Math.abs(x.value)/range*110,2);
          return (
            <div key={x.label} className="flex min-w-8 flex-1 flex-col items-center justify-between h-full py-1">
              <span className={`text-[10px] ${isNeg?"font-bold text-rose-600":"font-semibold text-slate-600"}`}>{signedYen(x.value)}</span>
              <div className="relative w-full h-[110px] flex items-center justify-center">
                <div className="absolute w-full border-t border-slate-300" style={{top:`${zeroPos}px`}}/>
                <div
                  title={`${x.label}: ${signedYen(x.value)}`}
                  className={`absolute w-full max-w-7 ${isNeg?"bg-rose-500 rounded-b":"bg-indigo-500 rounded-t"}`}
                  style={isNeg?{top:`${zeroPos}px`,height:`${barH}px`}:{bottom:`${110-zeroPos}px`,height:`${barH}px`}}
                />
              </div>
              <span className="whitespace-nowrap text-[10px] text-slate-500">{x.label.length > 5 ? x.label.slice(5).replace("-","/") : x.label}</span>
            </div>
          );
        })}
      </div>;
    }

    // --- 3. 分析ダッシュボード ---
    function Analytics({data,ym,setYm}){
      const [mode,setMode]=useState("month"),[year,setYear]=useState(ym.slice(0,4));
      const years=Array.from(new Set([new Date().getFullYear().toString(),...Object.keys(data.monthly).map(x=>x.slice(0,4))])).sort((a,b)=>Number(b)-Number(a));
      
      const keys=useMemo(()=>{
        const saved=Object.keys(data.monthly).sort();
        if(mode==="month") return [ym];
        if(mode==="year") return Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,"0")}`);
        return saved.length ? saved : [ym];
      },[mode,year,ym,data.monthly]);

      const rows=keys.map(key=>stats(data,key));

      // 集計: 資金管理側支出(spending)のみ使用し、精算(life)は除外
      const total=rows.reduce((o,r)=>({
        life:o.life+r.life,due:o.due+r.due,recovered:o.recovered+r.recovered,
        fixed:o.fixed+r.fixed,temp:o.temp+r.temp,spending:o.spending+r.spending,
        income:o.income+r.income
      }),{life:0,due:0,recovered:0,fixed:0,temp:0,spending:0,income:0});

      const categoryRows=data.categories.map(c=>({
        ...c,
        amount:rows.reduce((s,r)=>s+p(r.ex[c.id]),0),
        average:rows.length?rows.reduce((s,r)=>s+p(r.ex[c.id]),0)/rows.length:0
      }));

      const latestKey=Object.keys(data.monthly).sort().at(-1)||ym;
      const latest=stats(data,latestKey);
      
      const unpaidMonths=rows.filter(r=>r.due>0 && !r.isPaid).map(r=>r.key);
      const net=total.income-total.spending;
      const cash=latest.assets.cash,securities=latest.assets.securities;
      const assetTotal=cash+securities;

      // 前月比データ（当月選択時）
      const prevKey=prevYM(ym);
      const prevStats=stats(data,prevKey);
      const currentStats=stats(data,ym);

      const incomeChart=rows.map(r=>({label:r.key,value:r.income}));
      const spendingChart=rows.map(r=>({label:r.key,value:r.spending}));
      const netChart=rows.map(r=>({label:r.key,value:r.net}));
      const securityChart=rows.map(r=>({label:r.key,value:r.assets.securities}));
      const assetChart=rows.map(r=>({label:r.key,value:r.assets.total}));

      const assetPortfolio=[
        {name:"現金残高",amount:cash},
        {name:"証券投資評価額",amount:securities}
      ];

      return <div className="space-y-5">
        <div><h2 className="text-xl font-bold">分析ダッシュボード</h2><p className="mt-1 text-sm text-slate-500">精算・資金繰り・資産状態を統合可視化します。</p></div>

        <Card>
          <div className="flex flex-wrap items-center gap-3">
            <div className="flex rounded-lg bg-slate-100 p-1">{[["month","当月"],["year","年別"],["all","全期間"]].map(([v,label])=><button key={v} onClick={()=>setMode(v)} className={`rounded-md px-3 py-2 text-sm font-bold ${mode===v?"bg-white text-indigo-700 shadow-sm":"text-slate-500"}`}>{label}</button>)}</div>
            {mode==="month"&&<MonthPick ym={ym} setYm={setYm}/>}
            {mode==="year"&&<label className="text-sm font-medium">対象年<select value={year} onChange={e=>setYear(e.target.value)} className="ml-2 rounded-lg border border-slate-300 px-3 py-2">{years.map(y=><option key={y}>{y}</option>)}</select></label>}
          </div>
        </Card>

        {/* 精算セクション */}
        <section className="space-y-3">
          <h3 className="font-bold text-indigo-800">精算分析</h3>
          <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
            <Stat label="生活費合計" value={yen(total.life)}/>
            <Stat label="回収対象額" value={yen(total.due)} tone="bg-indigo-600 text-white"/>
            <Stat label="実回収額" value={yen(total.recovered)} tone="bg-emerald-600 text-white"/>
          </div>

          <Card>
            <div className="flex items-center justify-between">
              <div><h3 className="font-bold">未回収状態の月</h3><p className="mt-1 text-sm text-slate-500">対象期間内の回収完了フラグが立っていない月の一覧です。</p></div>
              <span className={`rounded-full px-3 py-1 text-sm font-bold ${unpaidMonths.length===0?"bg-emerald-100 text-emerald-700":"bg-amber-100 text-amber-700"}`}>
                {unpaidMonths.length===0?"全て回収済み":`未回収 ${unpaidMonths.length}ヶ月`}
              </span>
            </div>
            {unpaidMonths.length>0&&<p className="mt-3 font-semibold text-rose-600 text-sm">未回収月: {unpaidMonths.join("、")}</p>}
          </Card>

          <div className="grid gap-4 lg:grid-cols-2">
            <Card className="overflow-hidden p-0"><div className="p-4"><h3 className="font-bold">カテゴリ別精算実績</h3></div>
            <div className="overflow-x-auto"><table className="w-full min-w-[500px] text-sm"><thead className="bg-slate-50 text-left text-slate-500"><tr><th className="px-4 py-3">カテゴリ</th><th>予算</th><th>実績合計</th><th className="px-4">予算達成率</th></tr></thead><tbody className="divide-y divide-slate-100">{categoryRows.map(c=>{const rate=c.budget?c.average/c.budget*100:0;return <tr key={c.id}><td className="px-4 py-3 font-medium">{c.name}</td><td>{yen(c.budget)}</td><td>{yen(c.amount)}</td><td className={`px-4 font-bold ${rate>100?"text-rose-600":"text-emerald-600"}`}>{rate.toFixed(0)}%</td></tr>})}</tbody></table></div></Card>
            <Card><h3 className="font-bold">カテゴリ別生活費割合</h3><Donut rows={categoryRows}/></Card>
          </div>
        </section>

        {/* 資金繰り・資産セクション */}
        <section className="space-y-3">
          <h3 className="font-bold text-emerald-800">資金繰り・資産分析</h3>
          <p className="text-xs text-slate-500">※ 支出合計から精算生活費（生活費の精算）は除外されています。</p>

          <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
            <Stat label="総収入" value={yen(total.income)} tone="bg-emerald-600 text-white"/>
            <Stat label="支出合計（固定+臨時）" value={yen(total.spending)}/>
            <Stat label="純貯蓄額（収入-支出）" value={signedYen(net)} tone={net<0?"bg-rose-600 text-white":"bg-slate-900 text-white"}/>
            <Stat label="最新総資産（現金+証券）" value={yen(assetTotal)} tone="bg-indigo-600 text-white"/>
          </div>

          {/* 前月比（当月表示時のみ） */}
          {mode==="month"&&(
            <Card>
              <h3 className="font-bold mb-2">前月（{prevKey}）との比較</h3>
              <div className="grid gap-3 sm:grid-cols-3 text-sm">
                <div><p className="text-slate-500">収入変化</p><strong className={currentStats.income>=prevStats.income?"text-emerald-600":"text-rose-600"}>{signedYen(currentStats.income-prevStats.income)}</strong></div>
                <div><p className="text-slate-500">支出変化</p><strong className={currentStats.spending<=prevStats.spending?"text-emerald-600":"text-rose-600"}>{signedYen(currentStats.spending-prevStats.spending)}</strong></div>
                <div><p className="text-slate-500">純貯蓄変化</p><strong className={currentStats.net>=prevStats.net?"text-emerald-600":"text-rose-600"}>{signedYen(currentStats.net-prevStats.net)}</strong></div>
              </div>
            </Card>
          )}

          <div className="grid gap-4 lg:grid-cols-2">
            <Card><h3 className="font-bold">月間純貯蓄（収支）の推移</h3><Chart data={netChart} color="bg-indigo-500" signed/></Card>
            <Card><h3 className="font-bold">総資産ポートフォリオ</h3><Donut rows={assetPortfolio} title="資産構成"/></Card>
          </div>

          <div className="grid gap-4 lg:grid-cols-2">
            <Card><h3 className="font-bold">収入推移</h3><Chart data={incomeChart} color="bg-emerald-500"/></Card>
            <Card><h3 className="font-bold">支出推移（固定費+臨時出費）</h3><Chart data={spendingChart} color="bg-rose-500"/></Card>
          </div>

          <Card><h3 className="font-bold">総資産（現金 + 証券評価額）の推移</h3><Chart data={assetChart} color="bg-cyan-500"/></Card>
        </section>
      </div>
    }

    // --- 4. ポイント管理 ---
    function Points({data,setData}){
      const rows=data.points.map(point=>{
        const balance=p(data.pointBalances?.[point.id]);
        return {...point,balance,regular:balance*n(point.regularRate),campaign:balance*n(point.campaignRate)};
      });
      const regular=rows.reduce((s,x)=>s+x.regular,0),campaign=rows.reduce((s,x)=>s+x.campaign,0);

      return <div className="space-y-4">
        <div><h2 className="text-xl font-bold">ポイント・マイル管理</h2><p className="mt-1 text-sm text-slate-500">ポイント残高 × 交換倍率でマイルを計算します。</p></div>
        <div className="grid gap-3 sm:grid-cols-2"><Stat label="通常交換での合計マイル" value={`${regular.toLocaleString(undefined,{maximumFractionDigits:1})} mile`} tone="bg-slate-900 text-white"/><Stat label="キャンペーン時の合計マイル" value={`${campaign.toLocaleString(undefined,{maximumFractionDigits:1})} mile`} tone="bg-indigo-600 text-white"/></div>
        <Card className="overflow-hidden p-0"><div className="overflow-x-auto"><table className="w-full min-w-[650px] text-sm"><thead className="bg-slate-50 text-left text-slate-500"><tr><th className="px-4 py-3">ポイント種別</th><th>現在残高</th><th>通常倍率</th><th>通常マイル</th><th className="px-4">キャンペーンマイル</th></tr></thead><tbody className="divide-y divide-slate-100">{rows.map(x=><tr key={x.id}><td className="px-4 py-3 font-medium">{x.name}</td><td><Money small value={x.balance} onChange={v=>setData(d=>({...d,pointBalances:{...d.pointBalances,[x.id]:p(v)}}))}/></td><td>× {n(x.regularRate)}</td><td>{x.regular.toLocaleString(undefined,{maximumFractionDigits:1})}</td><td className="px-4 font-bold text-indigo-700">{x.campaign.toLocaleString(undefined,{maximumFractionDigits:1})}</td></tr>)}</tbody></table></div></Card>
      </div>
    }

    // --- 5. 設定 & バックアップ/CSV ---
    function Master({title,headers,items,cells,onAdd,onRemove}){
      return <Card className="overflow-hidden p-0"><div className="flex items-center justify-between p-4"><h3 className="font-bold">{title}</h3><button onClick={onAdd} className="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-bold text-white">＋ 追加</button></div><div className="overflow-x-auto"><table className="w-full min-w-[650px] text-sm"><thead className="bg-slate-50 text-left text-slate-500"><tr>{headers.map(x=><th key={x} className="px-4 py-2">{x}</th>)}<th/></tr></thead><tbody className="divide-y divide-slate-100">{items.map(item=><tr key={item.id}>{cells(item).map((cell,i)=><td key={i} className="px-4 py-2">{cell}</td>)}<td className="px-4 text-right"><button onClick={()=>{if(confirm("この項目をマスタから削除しますか？"))onRemove(item.id);}} className="text-rose-600 hover:underline">削除</button></td></tr>)}</tbody></table></div></Card>
    }

    function Settings({data,setData}){
      const ref=useRef(null);
      
      const edit=(key,id,field,value)=>{
        const isString = ["name","account","recovery"].includes(field);
        setData(d=>{
          if(key==="accounts" && field==="name"){
            const oldAcc=d.accounts.find(x=>x.id===id);
            const oldName=oldAcc?.name;
            return {
              ...d,
              accounts:d.accounts.map(x=>x.id===id?{...x,name:value}:x),
              bills:oldName ? d.bills.map(b=>b.account===oldName?{...b,account:value}:b) : d.bills
            };
          }
          return {
            ...d,
            [key]:d[key].map(x=>x.id===id?{...x,[field]: isString ? value : n(value)}:x)
          };
        });
      };

      const add=(key,value)=>setData(d=>({...d,[key]:[...d[key],{...value,id:Date.now()}]}));
      const remove=(key,id)=>setData(d=>({...d,[key]:d[key].filter(x=>x.id!==id)}));
      
      const exportJSON=()=>{
        const updatedData={...data,settings:{...data.settings,lastBackupDate:new Date().toISOString()}};
        setData(updatedData);
        const blob=new Blob([JSON.stringify({app:"くらし家計帳",version:8,data:updatedData},null,2)],{type:"application/json"});
        const url=URL.createObjectURL(blob),a=document.createElement("a");
        a.href=url;a.download=`kakei-backup-${nowYM()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
      };

      const exportCSV=()=>{
        let csv="\uFEFF年月,区分,項目名,金額/評価額,メモ/詳細\n";
        Object.entries(data.monthly).sort().forEach(([ym,m])=>{
          (m.incomeItems||[]).forEach(i=>csv+=`${ym},収入,${i.name},${i.amount},\n`);
          billsFor(data,m).forEach(b=>csv+=`${ym},固定費,${b.name},${b.amount},口座:${b.account}\n`);
          (m.tempExpenses||[]).forEach(t=>csv+=`${ym},臨時出費,${t.name},${t.amount},\n`);
          (m.securities||[]).forEach(s=>csv+=`${ym},証券,${s.name},${s.value},損益:${s.profit}\n`);
        });
        const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
        const url=URL.createObjectURL(blob),a=document.createElement("a");
        a.href=url;a.download=`kakei-export-${nowYM()}.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
      };

      const importJSON=e=>{
        const file=e.target.files?.[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=x=>{try{const parsed=JSON.parse(x.target.result),value=parsed.data||parsed;if(!value||typeof value!=="object")throw Error();if(confirm("現在のデータを復元内容で置き換えます。よろしいですか？")){setData(normalize(value));alert("データを復元しました。")}}catch{alert("JSONファイルを読み込めませんでした。")}finally{e.target.value=""}};
        reader.readAsText(file);
      };

      return <div className="space-y-4">
        <div><h2 className="text-xl font-bold">設定・マスタ管理</h2><p className="mt-1 text-sm text-slate-500">マスタデータ、起算日、エクスポートを管理します。</p></div>

        <Card>
          <h3 className="font-bold">バックアップ・データ出力</h3>
          <p className="mt-1 text-sm text-slate-500">定期的なバックアップを推奨します（CSV出力はExcel等で閲覧可能）。</p>
          <div className="mt-4 flex flex-wrap gap-2">
            <button onClick={exportJSON} className="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-bold text-white shadow hover:bg-indigo-700">JSONバックアップを保存</button>
            <button onClick={exportCSV} className="rounded-lg bg-emerald-600 px-4 py-2 text-sm font-bold text-white shadow hover:bg-emerald-700">CSVエクスポート</button>
            <button onClick={()=>ref.current?.click()} className="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-bold hover:bg-slate-50">JSON復元</button>
            <input ref={ref} type="file" accept=".json,application/json" onChange={importJSON} className="hidden"/>
          </div>
        </Card>

        <Card><h3 className="font-bold">起算日設定</h3><div className="mt-3 grid gap-3 sm:grid-cols-2"><label className="text-sm font-medium">精算の起算日<div className="mt-1"><Money small value={data.settings.settlementStart} onChange={v=>setData(d=>({...d,settings:{...d.settings,settlementStart:p(v)}}))}/><span className="ml-2 text-xs">日</span></div></label><label className="text-sm font-medium">資金繰りの起算日<div className="mt-1"><Money small value={data.settings.cashStart} onChange={v=>setData(d=>({...d,settings:{...d.settings,cashStart:p(v)}}))}/><span className="ml-2 text-xs">日</span></div></label></div></Card>

        <Master title="カテゴリマスタ・回収設定" headers={["名称","予算","回収方法","固定回収額"]} items={data.categories} cells={c=>[<Text value={c.name} onChange={v=>edit("categories",c.id,"name",v)}/>,<Money small value={c.budget} onChange={v=>edit("categories",c.id,"budget",v)}/>,<select value={c.recovery} onChange={e=>edit("categories",c.id,"recovery",e.target.value)} className="rounded border border-slate-300 px-2 py-1.5"><option value="half">折半（50%）</option><option value="full">全額（100%）</option><option value="fixed">固定額回収</option></select>,<Money small value={c.recoveryAmount} onChange={v=>edit("categories",c.id,"recoveryAmount",v)}/>]} onAdd={()=>add("categories",{name:"新しいカテゴリ",budget:0,recovery:"half",recoveryAmount:0})} onRemove={id=>remove("categories",id)}/>

        <Master title="固定費マスタ" headers={["名称","標準予算","支払日","引落口座"]} items={data.bills} cells={b=>[<Text value={b.name} onChange={v=>edit("bills",b.id,"name",v)}/>,<Money small value={b.budget} onChange={v=>edit("bills",b.id,"budget",v)}/>,<Money small value={b.day} onChange={v=>edit("bills",b.id,"day",v)}/>,<select value={b.account} onChange={e=>edit("bills",b.id,"account",e.target.value)} className="rounded border border-slate-300 px-2 py-1.5 text-sm bg-white outline-none focus:border-indigo-500">{data.accounts.map(a=><option key={a.id} value={a.name}>{a.name}</option>)}</select>]} onAdd={()=>add("bills",{name:"新しい支出",budget:0,day:15,account:data.accounts[0]?.name||""})} onRemove={id=>remove("bills",id)}/>

        <Master title="口座マスタ" headers={["名称","初期残高"]} items={data.accounts} cells={a=>[<Text value={a.name} onChange={v=>edit("accounts",a.id,"name",v)}/>,<Money small value={a.balance} onChange={v=>edit("accounts",a.id,"balance",v)}/>]} onAdd={()=>add("accounts",{name:"新しい口座",balance:0})} onRemove={id=>remove("accounts",id)}/>

        <Master title="ポイント・マイルマスタ" headers={["名称","通常交換倍率","キャンペーン交換倍率"]} items={data.points} cells={x=>[<Text value={x.name} onChange={v=>edit("points",x.id,"name",v)}/>,<Decimal value={x.regularRate} onChange={v=>edit("points",x.id,"regularRate",v)}/>,<Decimal value={x.campaignRate} onChange={v=>edit("points",x.id,"campaignRate",v)}/>]} onAdd={()=>add("points",{name:"新しいポイント",regularRate:1,campaignRate:1})} onRemove={id=>remove("points",id)}/>
      </div>
    }

    // --- メインアプリ ---
    function App(){
      const [isLoading, setIsLoading] = useState(true);
      const [data, setData] = useState(() => normalize(null));
      const [ym, setYm] = useState(nowYM);
      const [tab, setTab] = useState("settlement");
      const isInitialLoaded = useRef(false);

      // 初回Firestoreデータ取得
      useEffect(() => {
        let isMounted = true;
        const fetchInitialData = async () => {
          try {
            let waitCount = 0;
            while ((!window.firebaseDb || !window.firebaseDoc || !window.firebaseGetDoc) && waitCount < 50) {
              await new Promise(r => setTimeout(r, 100));
              waitCount++;
            }

            if (!window.firebaseDb) {
              console.error("Firebaseの初期化タイムアウト");
              if (isMounted) setIsLoading(false);
              return;
            }

            const docRef = window.firebaseDoc(window.firebaseDb, "kakeibo_data", "main_doc");
            const docSnap = await window.firebaseGetDoc(docRef);

            if (docSnap.exists()) {
              const fetched = docSnap.data();
              if (isMounted) {
                setData(normalize(fetched));
                isInitialLoaded.current = true;
              }
            } else {
              const initialData = normalize(null);
              await window.firebaseSetDoc(docRef, initialData);
              if (isMounted) {
                setData(initialData);
                isInitialLoaded.current = true;
              }
            }
          } catch (err) {
            console.error("Firestoreからのデータ取得に失敗しました:", err);
          } finally {
            if (isMounted) {
              setIsLoading(false);
            }
          }
        };

        fetchInitialData();
        return () => { isMounted = false; };
      }, []);

      // データ更新時のFirestore非同期保存
      useEffect(() => {
        if (!isInitialLoaded.current) return;
        if (!window.firebaseDb || !window.firebaseDoc || !window.firebaseSetDoc) return;

        const saveToFirestore = async () => {
          try {
            const docRef = window.firebaseDoc(window.firebaseDb, "kakeibo_data", "main_doc");
            await window.firebaseSetDoc(docRef, data);
          } catch (err) {
            console.error("Firestoreへの保存に失敗しました:", err);
          }
        };

        saveToFirestore();
      }, [data]);

      // バックアップ警告判定（7日以上経過）
      const showBackupAlert = useMemo(()=>{
        if(!data.settings?.lastBackupDate) return true;
        const diffDays = (new Date() - new Date(data.settings.lastBackupDate)) / (1000 * 60 * 60 * 24);
        return diffDays > 7;
      },[data.settings?.lastBackupDate]);

      const m=useMemo(()=>({
        ...blank(),
        ...(data.monthly[ym]||{})
      }),[data.monthly,ym]);

      const put=(field,value)=>{
        setData(d=>({
          ...d,
          monthly:{
            ...d.monthly,
            [ym]:{
              ...blank(),
              ...(d.monthly[ym]||{}),
              [field]:value
            }
          }
        }));
      };

      const putMany=(obj)=>{
        setData(d=>({
          ...d,
          monthly:{
            ...d.monthly,
            [ym]:{
              ...blank(),
              ...(d.monthly[ym]||{}),
              ...obj
            }
          }
        }));
      };

      const tabs=[
        ["settlement","生活費の精算"],
        ["cashflow","個人資金管理"],
        ["analytics","分析"],
        ["points","ポイント・マイル"],
        ["settings","設定"]
      ];

      if (isLoading) {
        return (
          <div className="flex min-h-screen flex-col items-center justify-center bg-slate-50 text-slate-600">
            <div className="h-10 w-10 animate-spin rounded-full border-4 border-indigo-200 border-t-indigo-600"></div>
            <p className="mt-4 text-base font-bold">読み込み中...</p>
          </div>
        );
      }

      return (
        <div className="mx-auto max-w-5xl px-4 py-6 safe-bottom">
          {/* バックアップリマインダー */}
          {showBackupAlert && (
            <div className="mb-4 flex items-center justify-between rounded-xl border border-amber-200 bg-amber-50 p-3 text-sm text-amber-800">
              <span>⚠️ データのバックアップが1週間以上行われていません。設定画面からJSON保存をおすすめします。</span>
              <button onClick={()=>setTab("settings")} className="font-bold underline ml-2">設定へ</button>
            </div>
          )}

          <header className="mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-4">
            <h1 className="text-2xl font-bold text-indigo-600">くらし家計帳</h1>
            <nav className="flex items-center gap-1 overflow-x-auto rounded-xl bg-slate-200/60 p-1 max-w-full">
              {tabs.map(([id,label])=>(
                <button
                  key={id}
                  onClick={()=>setTab(id)}
                  className={`whitespace-nowrap flex-shrink-0 rounded-lg px-3 py-2 text-sm font-bold transition-all ${
                    tab===id?"bg-white text-indigo-600 shadow-sm":"text-slate-600 hover:text-slate-900"
                  }`}
                >
                  {label}
                </button>
              ))}
            </nav>
          </header>

          <main>
            {tab==="settlement"&&<Settlement data={data} m={m} put={put} ym={ym} setYm={setYm}/>}
            {tab==="cashflow"&&<Cashflow data={data} m={m} put={put} putMany={putMany} ym={ym} setYm={setYm}/>}
            {tab==="analytics"&&<Analytics data={data} ym={ym} setYm={setYm}/>}
            {tab==="points"&&<Points data={data} setData={setData}/>}
            {tab==="settings"&&<Settings data={data} setData={setData}/>}
          </main>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught an error:", error, errorInfo);
      }
      handleReset = async () => {
        if (confirm("クラウドのデータを初期化して再読み込みしますか？\n（事前にバックアップJSONをお持ちの場合は後から設定画面で復元できます）")) {
          try {
            if (window.firebaseDb && window.firebaseDoc && window.firebaseSetDoc) {
              const docRef = window.firebaseDoc(window.firebaseDb, "kakeibo_data", "main_doc");
              await window.firebaseSetDoc(docRef, normalize(null));
            }
          } catch (e) {
            console.error("初期化エラー:", e);
          }
          window.location.reload();
        }
      };
      render() {
        if (this.state.hasError) {
          return (
            <div className="mx-auto max-w-lg p-6 my-12 bg-white rounded-2xl border border-rose-200 shadow-xl text-center space-y-4">
              <h2 className="text-xl font-bold text-rose-600">⚠️ エラーが発生しました</h2>
              <p className="text-sm text-slate-600">データの読み込みまたは画面描画中に問題が発生しました。</p>
              <div className="p-3 bg-rose-50 rounded-lg text-xs text-rose-800 text-left font-mono overflow-auto max-h-32 whitespace-pre-wrap">
                {this.state.error?.toString()}
              </div>
              <div className="flex justify-center gap-3 pt-2">
                <button onClick={()=>window.location.reload()} className="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-bold text-white shadow hover:bg-indigo-700">ページ再読み込み</button>
                <button onClick={this.handleReset} className="rounded-lg border border-rose-300 bg-rose-50 px-4 py-2 text-sm font-bold text-rose-700 hover:bg-rose-100">データ初期化</button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const root=ReactDOM.createRoot(document.getElementById("root"));
    root.render(
      <ErrorBoundary>
        <App/>
      </ErrorBoundary>
    );
  </script>
</body>
</html>
